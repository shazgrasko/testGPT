<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Invitation Card Generator</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <main class="app">
    <section class="controls">
      <h1>Invitation Card Generator</h1>
      <p>Create a personalized invitation card in seconds.</p>

      <form id="invitationForm">
        <label>
          Event Name
          <input type="text" id="eventName" placeholder="Birthday Bash" required />
        </label>

        <label>
          Host Name
          <input type="text" id="hostName" placeholder="Alex" required />
        </label>

        <label>
          Date
          <input type="date" id="eventDate" required />
        </label>

        <label>
          Time
          <input type="time" id="eventTime" required />
        </label>

        <label>
          Venue
          <input type="text" id="eventVenue" placeholder="Sunset Hall" required />
        </label>

        <label>
          Message
          <textarea id="eventMessage" rows="3" placeholder="Join us for a fun celebration!" required></textarea>
        </label>

        <label>
          Theme Color
          <input type="color" id="themeColor" value="#8a2be2" />
        </label>

        <button type="submit">Generate Card</button>
      </form>
    </section>

    <section class="preview" aria-live="polite">
      <article id="card" class="card">
        <h2 id="cardEventName">Your Event Name</h2>
        <p class="line"><strong>Hosted by:</strong> <span id="cardHostName">Host Name</span></p>
        <p class="line"><strong>Date:</strong> <span id="cardDate">Event Date</span></p>
        <p class="line"><strong>Time:</strong> <span id="cardTime">Event Time</span></p>
        <p class="line"><strong>Venue:</strong> <span id="cardVenue">Event Venue</span></p>
        <p id="cardMessage" class="message">Your custom invitation message will appear here.</p>
      </article>
    </section>
  </main>

  <script src="script.js"></script>
</body>
</html>
